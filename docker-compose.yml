version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: e2ee-postgres
    environment:
      POSTGRES_DB: e2ee_app
      POSTGRES_USER: e2ee_user
      POSTGRES_PASSWORD: e2ee_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2ee_user -d e2ee_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: e2ee-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: e2ee-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/cors.json:/tmp/cors.json
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/e2ee-files --ignore-existing;
      mc anonymous set download local/e2ee-files;
      mc cors set local/e2ee-files /tmp/cors.json;
      echo 'MinIO initialized successfully';
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e2ee-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://e2ee_user:e2ee_secret@postgres:5432/e2ee_app
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: e2ee-files
      MINIO_EXTERNAL_ENDPOINT: localhost:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: e2ee-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
